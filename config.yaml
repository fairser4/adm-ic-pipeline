# config.yaml 
# CLASS-stage inputs (cosmology + aDM microphysics)

cosmology:
  h: 0.702                    # dimensionless hubble parameter, H0 = 100h km/s/Mpc
  Omega_m: 0.272              # total matter density, (CDM + baryons + aDM) / critical
  Omega_b: 0.0455             # baryon density / critical
  n_s: 0.961                  # scalar spectral index (primordial power-law tilt)
  sigma_8: 0.807              # amplitude of matter fluctuations in 8 Mpc/h spheres
  T_cmb: 2.725                # CMB temperature today [K]

adm: 
  f_adm: 0.06                 # Omega_adm / Omega_dm
  m_p_ratio: 1.0              # dark proton mass / SM proton mass
  m_e_ratio: 10.0              # dark electron mass / SM electron mass
  alpha_dark_ratio: 0.22      # dark/SM fine structure constant ratio
  xi: 0.1                     # T_dark / T_cmb today

  YHe_twin: 0.0               # dark helium mass fraction (0 = pure dark hydrogen)
  z_start: 99                 # initial redshift

halo:
  box: 5.0                    # box size [Mpc/h]
  levelmin: 7                 # coarse base grid level (2^levelmin per side)
  levelmax: 11                # finest zoom level (aDM run uses levelmax-1 automatically)
  seeds:                      # white noise seeds per level
    9: 438290
    10: 438290
    11: 438290
  region_type: convex_hull    # convex hull or ellipsoid
  region_point_file: m10q_lr_pts    # path to the lagrangian region points
  region_point_shift: [55, 14, 56]  # shift aligning the points to the box
  region_point_levelmin: 7          # level the shift refers to

class:
  P_k_max: 40.0               # CLASS P_k_max_h/Mpc; raise for higher-resolution boxes

run:
  name: m10q_slow

paths:
  class_exe: /home/fairser4/links/scratch/class_adm-3.1/class